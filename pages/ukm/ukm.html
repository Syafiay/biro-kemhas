<!--
  Wrapper ini sengaja dibiarkan KOSONG.
  Isinya (semua kartu UKM) di-generate otomatis oleh ukm-render.js
  berdasarkan data di ukm-data.js. Untuk nambah/ubah UKM, edit
  ukm-data.js — tidak perlu sentuh HTML ini lagi.
-->
<div class="cards-wrapper"></div>

<!--
  URUTAN SCRIPT PENTING:
  1. include-component.js dulu -- ini yang nge-fetch navbar.html &
     nembak event "components:loaded" begitu selesai.
  2. Baru script-script lain yang BUTUH navbar sudah ada di DOM
     (navbar.js, site-interactions.js) -- mereka masing-masing sudah
     nunggu event "components:loaded", jadi urutan taruh <script> di
     bawah ini sebenarnya nggak terlalu kritis, tapi tetap dirapikan
     biar gampang dibaca alurnya.
-->
<script src="/assets/js/ukm-data.js"></script>
<script src="/assets/js/ukm-render.js"></script>
<script src="/assets/js/include-component.js"></script>
<script src="/assets/js/navbar.js"></script>
<script src="/assets/js/site-interaction.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", hideSpinnerIfPresent);
  window.addEventListener("load", hideSpinnerIfPresent);

  function hideSpinnerIfPresent() {
    const s = document.getElementById("spinner");
    if (!s) return;
    s.classList.remove("show");
    s.style.display = "none";
  }
</script>
</body>
